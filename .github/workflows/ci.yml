name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_NAME: perdiem-management-system
      APP_VERSION: 1.0.0
      APP_PORT: 3001
      APP_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3002
      MONGODB_URI: mongodb://localhost:27017/perdiem_test
      JWT_ACCESS_SECRET: test-access-secret-32-characters!!
      JWT_REFRESH_SECRET: test-refresh-secret-32-characters!
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      LOG_LEVEL: error
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_AUTH_MAX: 100
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm build:api

      - name: Build frontend
        run: pnpm build:web

      - name: Run backend unit tests
        run: pnpm --filter @perdiem/backend exec jest --runInBand --forceExit

      - name: Run backend E2E tests
        run: pnpm --filter @perdiem/backend test:e2e
